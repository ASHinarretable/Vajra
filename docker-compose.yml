# ===========================================================================
# Shared Airflow environment — referenced by init / webserver / scheduler.
# ===========================================================================
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment:
    &airflow-env
    # Airflow core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-sDGsj4K7imH65S4GsridqaRAko1ZOUD4v12MkAXdBZg=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow metadata DB (separate from vajra data)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    # Webserver
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-vajra-local-dev-secret}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Vajra Postgres — forwarded so the DAG can query the data DB
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-vajra}
    POSTGRES_USER: ${POSTGRES_USER:-vajra}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra}
    # MinIO — for the archival DAG
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: vajra
    MINIO_SECRET_KEY: vajra2026
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy


services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper). Single broker for local development.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: vajra-kafka
    ports:
      - "9092:9092"   # host access -> localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: vajra-cluster-000000000001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Topic bootstrap — creates the enterprise topic set explicitly.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: vajra-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in transactions.raw transactions.cleaned transactions.suspicious transactions.dead-letter; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1;
      done;
      echo 'Topics ready:';
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  # ---------------------------------------------------------------------------
  # PostgreSQL (vajra) — raw + processed + fraud + metrics layers.
  # sql/init/*.sql runs automatically on first boot.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: vajra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vajra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra}
      POSTGRES_DB: ${POSTGRES_DB:-vajra}
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vajra} -d ${POSTGRES_DB:-vajra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # PostgreSQL (Airflow metadata) — kept separate from vajra data so the two
  # concerns never share a schema or migrations.
  # ---------------------------------------------------------------------------
  postgres-airflow:
    image: postgres:16
    container_name: vajra-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Airflow init — runs once to migrate the metadata DB and create admin user.
  # The webserver and scheduler wait for this to complete successfully.
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: vajra-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Vajra \
          --lastname Admin \
          --role Admin \
          --email admin@vajra.local
        echo "Airflow init complete."
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Airflow webserver — UI at http://localhost:8080  (admin / admin)
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: vajra-airflow-webserver
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow scheduler — picks up DAGs and triggers task runs on schedule.
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: vajra-airflow-scheduler
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — shared feature-state store for horizontally-scaled consumers.
  # When REDIS_URL is set the consumer uses RedisFeatureEngine; otherwise it
  # falls back to in-memory (single-instance, no dependency on Redis).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: vajra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for raw-event Parquet archival.
  # UI at http://localhost:9001  (vajra / vajra2026)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: vajra-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: vajra
      MINIO_ROOT_PASSWORD: vajra2026
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes consumer /metrics on port 8000.
  # UI at http://localhost:9090
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vajra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      consumer:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana — pipeline health dashboard. UI at http://localhost:3001
  # Login: admin / vajra2026
  # Dashboard auto-provisioned from dashboard/grafana/provisioning/
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: vajra-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: vajra2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Transaction generator (Python producer).
  # ---------------------------------------------------------------------------
  producer:
    build: ./producer
    container_name: vajra-producer
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fraud detection / processing consumer.
  # ---------------------------------------------------------------------------
  consumer:
    build: ./consumer
    container_name: vajra-consumer
    ports:
      - "8000:8000"   # Prometheus /metrics
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: vajra
      MINIO_SECRET_KEY: vajra2026
      MODEL_BUCKET: vajra-models
      ML_THRESHOLD: "0.8"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dead-letter queue consumer — reads unparseable/failed messages for review.
  # ---------------------------------------------------------------------------
  dlq-consumer:
    build: ./consumer
    container_name: vajra-dlq-consumer
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_DLQ: transactions.dead-letter
      CONSUMER_GROUP: vajra-dlq-consumer
    command: ["python", "-m", "dlq_consumer"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ML training job — trains XGBoost on ground-truth labels, uploads to MinIO.
  # Behind the "ml" profile (one-off). Reuses the consumer image (no new build).
  #     docker compose --profile ml run --rm ml-train
  # ---------------------------------------------------------------------------
  ml-train:
    build: ./consumer
    profiles: ["ml"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: vajra
      MINIO_SECRET_KEY: vajra2026
      MODEL_BUCKET: vajra-models
      ML_THRESHOLD: "0.8"
    command: ["python", "-m", "ml.train"]

  # ---------------------------------------------------------------------------
  # ML backfill job — scores all historical rows with the trained model.
  #     docker compose --profile ml run --rm ml-backfill
  # ---------------------------------------------------------------------------
  ml-backfill:
    build: ./consumer
    profiles: ["ml"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: vajra
      MINIO_SECRET_KEY: vajra2026
      MODEL_BUCKET: vajra-models
      ML_THRESHOLD: "0.8"
    command: ["python", "-m", "ml.score_backfill"]

  # ---------------------------------------------------------------------------
  # Spark batch layer — on-demand feature backfill job. Not started by a normal
  # `docker compose up` (it's behind the "batch" profile); run it explicitly:
  #     docker compose run --rm spark
  # Recomputes customer_profile + merchant_risk from full Postgres history.
  # ---------------------------------------------------------------------------
  spark:
    build: ./spark
    container_name: vajra-spark
    profiles: ["batch"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vajra}
      POSTGRES_USER: ${POSTGRES_USER:-vajra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - "local[*]"
      - /opt/spark/jobs/feature_backfill.py

  # ---------------------------------------------------------------------------
  # Metabase — self-service BI / dashboards. UI at http://localhost:3000
  # First run: create an admin account, then add the vajra Postgres as a data
  # source (host: postgres, port: 5432, db/user/pass: vajra).
  #
  # App metadata is stored in the metabase-data volume (Metabase's built-in
  # H2 store) so dashboards survive restarts. For a production deploy you would
  # point MB_DB_* at a dedicated Postgres app database instead.
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.21
    container_name: vajra-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Kolkata
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
  airflow-pgdata:
  airflow-logs:
  metabase-data:
  minio-data:
  prometheus-data:
  grafana-data:
